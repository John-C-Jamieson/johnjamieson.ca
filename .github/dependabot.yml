# Monthly update pull requests (ARCHITECTURE §6.4). Minor and patch updates
# come grouped, one pull request per ecosystem; each major update comes on its
# own, since those need reading first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Astro's checker supports TypeScript 6 at most (D-8)
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node 24 on the PC and on GitHub (D-8)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
