# The site's own words (ARCHITECTURE §4). They frame the facts in
# content/resume.json but add none. The build checks that:
#   - every number here appears in resume.json;
#   - each figure and work card quotes the one bullet its `find` phrase
#     matches;
#   - every job and break sits in exactly one phase.
#
# Written at BUILD step 10 and approved by John on 2026-11-01.

meta:
  # The home page's description, for search results and link previews
  description: >-
    John Jamieson is a Data & BI Analyst in Toronto who builds SQL reporting,
    dashboards and automated data processes, grounded in years of accounting.

hero:
  headline: Turning financial data into answers people can trust.
  intro: >-
    Few data analysts speak finance, and few finance people build. I do both:
    SQL, reporting and automation, grounded in years of accounting.

sections:
  figures:
    title: At a glance
  work:
    title: Selected work
    intro: Four pieces of work, in the résumé's own words.
  path:
    title: Career path
    intro: >-
      I started in accounting, retrained in programming, then moved into
      systems and data. The finance years are why I know what the numbers are
      for.
  principles:
    title: How I work
  skills:
    title: Skills
  education:
    title: Education

# Each value must appear in its source bullet
figures:
  - value: "30+"
    label: reporting and data-extract requests resolved in just over six months
    source: { job: First National, find: "30+ resolved" }
  - value: "5+"
    label: business areas served, from mortgage operations to transformation projects
    source: { job: First National, find: "5+ business areas" }
  - value: "300+"
    label: records whose identifier history was rebuilt from field-level audit logs
    source: { job: First National, find: "300+ records" }
  - value: "44%"
    label: fewer lines of code after refactoring a production program
    source: { job: CIBC, find: "44% reduction" }

# The proof points the career strategy leads with. The title is the site's;
# the card's text is the résumé bullet, word for word.
work:
  - title: From a vague request to an auditable report
    source: { job: First National, find: "459-event" }
  - title: Dashboards directors relied on
    source: { job: CIBC, find: "eazyBI" }
  - title: A revenue reporting system across currencies and entities
    source: { job: Entertainment One, find: "revenue and cost-of-sales" }
  - title: An ERP migration, end to end
    source: { job: Circle of Care, find: "Dynamics (GP)" }

# The years come from the jobs' dates
phases:
  - label: Finance and accounting
    jobs: [Salumatics, Circle of Care, Entertainment One]
  - label: Retraining
    jobs: [Career Retraining]
  - label: Systems and data
    jobs: [CIBC, Professional Development, First National]

principles:
  - title: Define the question first
    text: >-
      A vague request becomes a testable definition: source, grain, date
      logic, status and duplicate rules, all settled before the query is
      written.
  - title: Check before delivering
    text: >-
      Nulls, placeholders, duplicates and odd histories get handled before a
      number leaves my desk.
  - title: Leave an audit trail
    text: >-
      Results someone else can check and rerun: auditable extracts, reusable
      SQL and the documentation behind them.
  - title: Automate what repeats
    text: >-
      Work that comes back every month should run itself, from the month-end
      close to journal-entry uploads.

# At the top of every page's footer, worded as on the old site (John,
# 2026-11-01; BUILD step 11b).
quote:
  text: >-
    Democracy is the worst form of government, except for all the others
    that have been tried.
  by: Winston Churchill
