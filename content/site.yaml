principles:
  - title: Define the question first
    text: >-
      Vague requests become testable definitions: source, grain, date logic
      and duplicate rules, settled before the query is written.
  - title: Leave an audit trail
    text: >-
      Results someone else can check: auditable extracts, saved queries and
      the documentation to rerun them.
  - title: Automate the second time
    text: >-
      Work that repeats becomes a process, from the month-end close to
      journal-entry uploads.
  - title: Speak finance and SQL
    text: >-
      Years in accounting mean the numbers get read the way the business
      reads them.
